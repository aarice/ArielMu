<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>

  <!-- Fonts: English Special Elite, Footer/Nav AR One Sans, Chinese Noto Sans HK as fallback for 思源黑体香港 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=AR+One+Sans:wght@400;500&family=Special+Elite&family=Noto+Sans+HK:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F2F2F1;
      --text:#666666;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      line-height:1.7;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Typography */
    .en-special{font-family:"Special Elite", serif;}
    .code{font-family:"AR One Sans", sans-serif;}
    .cn-serif{font-family:"Source Han Sans SC","Noto Sans HK",sans-serif;}

    /* Top Nav */
    header{
      position:relative; /* 从 sticky 改为 relative，取消置顶 */
      background:transparent;
      z-index: 100; /* 确保导航栏在最上层 */
    }
    .nav{
      max-width:1200px;
      margin:10px auto 0; /* 从 16px 改为 10px */
      padding:0px 24px;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      align-items:center;
      font-size:14px;
    }
    .nav a{
      color:var(--text);
      text-decoration:none;
      opacity:.7;
      transition: all 0.2s ease;
      display: inline-block;
      transform-origin: bottom center;
    }
    .nav a:hover{opacity:1; text-decoration:none;}
    .nav a:active{
      color: #ccc; 
      text-shadow: none;
      transform: perspective(500px) rotateX(60deg) skewX(-15deg);
    }
    .nav-left{justify-self:start;}
    .nav-center{justify-self:center;}
    .nav-right{justify-self:end;}

    /* Layout */
    .container{
      max-width:1200px;
      /* [微调位置] 使用负数值 (如 -120px) 让整体大幅向上移动，允许与导航栏重叠 */
      margin: -90px auto 0;
      padding: 0 24px 80px;
      display:grid;
      grid-template-columns:1.05fr 1fr;
      gap:2px;
      align-items:start; /* Changed from center to start to allow individual control */
      min-height:calc(100vh - 180px);
    }

    /* Left text block */
    .intro{
      padding:24px 0;
      display: flex;
      flex-direction: column;
      /* 这里的 height 设置是为了让 CTA 能够占据下半部分空间，
         如果需要调整整体高度范围，可以修改 min-height */
      min-height: 100px; 
    }
    
    .intro-top {
        /* 顶部文字组 */
        margin-bottom: 20px;
        /* [微调位置] 调整下面的数值，可以让 "Hi..." 整体下移 */
        padding-top: 210px; 
    }

    .intro-cta {
        /* 底部行动召唤 */
        /* 通过 margin-top 调整垂直位置，数值越大越靠下 */
        margin-top: 150px; 
        /* 通过 padding-left 调整水平缩进，数值越大越靠右 */
        padding-left: 320px; 
    }
    
    /* 字符级动画样式 */
    .char {
        display: inline-block;
        opacity: 0;
        transform: translateY(40px) skewY(10deg);
        animation: floatUpChar 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        white-space: pre; /* 保留空格 */
    }

    /* 漂浮升起动画 */
    @keyframes floatUpChar {
      0% {
        opacity: 0;
        transform: translateY(40px) skewY(10deg) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) skewY(0) rotate(0deg);
      }
    }

    /* 统一字体样式 */
    .intro h1, .intro h2, .intro p{
      margin:0;
      font-weight: 500; /* 统一字重 */
      font-size: 18px;  /* 统一字体大小 */
      line-height: 1.8;
    }

    .intro h1{
      margin-bottom: 8px;
    }
    .intro h2{
      margin-bottom: 0;
    }
    
    .intro p{
      margin-bottom: 0;
       /* CTA specific styles if needed */
    }

    /* Right visual block */
    .visual{
      position:relative;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:12px 0;
      /* Aligning visual block vertically if needed */
      margin-top: 40px; 
    }
    .tree-wrap{
      position:relative;
      width:100%;
      max-width:520px; /* controls tree size on desktop */
      margin:0 auto;
    }
    .tree{
      width:100%;
      height:auto;
      display:block;
      /* 默认显示图片，以防 p5.js 加载失败 */
      opacity: 1; 
      pointer-events:none;
      /* 添加过渡效果，防止切换时闪烁 */
      transition: opacity 0.8s ease-out;
    }

    /* Overlay labels on branches */
    .label{
      position:absolute;
      color:var(--text);
      font-size:10px;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      letter-spacing:0.5px;
      opacity:.9;
      /* 确保标签在 canvas 之上 */
      z-index: 20; 
      pointer-events: auto; /* 改为 auto，允许点击 */
      cursor: pointer; /* 添加鼠标指针样式 */
      transition: opacity 0.2s; /* 添加悬停过渡效果 */
    }
    .label:hover{
      opacity: 1; /* 悬停时完全不透明 */
    }
    /* approximate positions relative to tree image */
    .label.experience{top:29%; left:25%;}     /* 树枝左上 */
    .label.portfolio{top:54%; left:20%;}     /* 树枝中部 */
    /* [修改位置] 调整 introduction 的位置 - 统一使用 top/left 计算 */
    .label.introduction{top:56%; left:82%;}

    /* P5.js canvas overlay container */
    #p5-overlay{
      position:absolute;
      inset:0;           /* cover the tree-wrap */
      z-index:10;        /* above the image placeholder */
      pointer-events:auto; /* 允许 canvas 接收鼠标交互 */
    }
    
    /* 强制 canvas 响应式缩放 */
    #p5-overlay canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    /* Footer */
    footer{
      border-top:1px solid rgba(0,0,0,0.08);
      margin-top:24px;
    }
    .footer-inner{
      max-width:1200px;
      margin:0 auto;
      padding:18px 24px 28px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      font-size:13px; /* 12-14px */
    }
    .footer-inner .label-footer{
      /* 这里的规则集原本为空，若后续需要定制页脚标签样式可在此添加 */
      display: inline-block;
       /* renamed to avoid conflict with tree labels if any generic rules existed, though .label is scoped well enough above */
    }
    .footer-item b{
      display:block;
      font-weight:500;
      margin-bottom:6px;
    }

    /* Responsiveness */
    @media (max-width:1024px){
      .container{
        grid-template-columns:1fr;
        gap:12px;
        align-items: center;
      }
      .intro{
        text-align:center;
        min-height: auto;
      }
      .intro-cta {
          margin-top: 32px;
          padding-left: 0;
      }
      .visual { margin-top: 0; }
      .intro h2{margin-left:auto; margin-right:auto;}
      .visual .tree-wrap{max-width:420px;}
      .label{font-size:12px;}
      .label.experience{top:28%; left:25%;}
      .label.portfolio{top:53%; left:20%;}
      /* [移动端微调] 自我介绍标签：更靠左(right变大) 更靠上(bottom变大) */
      .label.introduction{bottom:18%; right:15%;}
    }
    @media (max-width:480px){
      .nav{padding:0 16px; font-size:12px;}
      .container{
        /* 调整为导航栏下方 20px */
        padding: 0 16px 64px; 
        margin-top: 50px; 
      }
      
      /* 文字上移及缩小 */
      .intro {
        padding-top: 0; 
        transform: none; 
      }
      .intro-top {
        padding-top: 0; /* 移除顶部留白，紧接 container 顶部 */
        margin-bottom: 10px;
      }
      .intro-cta {
        margin-top: 20px; /* 减少间距 */
      }
      .intro h1, .intro h2, .intro p{
        font-size: 15px; /* 缩小文字 */
        line-height: 1.5;
      }
      
      /* 树的显示调整 */
      .visual {
        margin-top: 5px; 
      }
      .visual .tree-wrap{
        max-width: 400px; /* 稍微缩小树 */
        transform: translateX(-5%); /* 整体左移10% */
      }
      
      /* 树上的"自我介绍introduction */
      .label.introduction {
        top: 56%;
        left: 78%;
        bottom: auto; 
        right: auto;
      }

      .footer-inner{
        grid-template-columns:1fr 1fr;
        row-gap:16px;
        font-size:12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <nav class="nav code">
      <a class="nav-left" href="./works.html">Works</a>

  <!-- Main -->
  <main class="container">
    <!-- Left text region -->
    <section class="intro">

  <!-- P5.js CDN (使用与 Sonnet_5 相同的版本以确保兼容性) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <!-- <script src="./Sonnet_5_p5js/p5.js"></script> -->


  <!-- P5.js 代码插入位置 START -->
  <script>
    let treeImg;
    let particles = [];
    let branchPoints = [];
    let poem = "Those hours that with gentle work did frame The lovely gaze where every eye doth dwell, Will play the tyrants to the very same And that unfair which fairly doth excel: For never-resting time leads summer on To hideous winter and confounds him there; Sap check’d with frost and lusty leaves quite gone, Beauty o’ersnow’d and bareness every where: Then, were not summer’s distillation left, A liquid prisoner pent in walls of glass, Beauty’s effect with beauty were bereft, Nor it, nor no remembrance what it was: But flowers distill’d, though they with winter meet, Leese but their show; their substance still lives sweet.";
    let poemIndex = 0;
    let isFinished = false;
    let groundMap = []; 

    // 引入用于平滑晃动的变量
    let currentSway = 0; 
    
    // 移动端点击触发计时器
    let mobileShakeTimer = 0;

    let config = {
      fontSize: 15,
      maxFallSpeed: 1.5,     
      drag: 0.97,            
      spawnIntensity: 12,    
      swayAmplitude: 0.03,   // 增大摇摆幅度 (原为 0.007)
      letterSpacing: 20,     
      groundY: 0.95,          
      driftRange: 0.5,       
      rotateSpeed: 0.7,      
      margin: 0.2            
    };

    function preload() {
      // 使用相对路径加载图片，增加错误处理
      treeImg = loadImage('./tree.png', 
        () => { console.log("Tree image loaded successfully"); },
        (err) => { 
          console.error("Failed to load tree image:", err); 
          // 如果加载失败（如 CORS 错误），保持静态图片显示
          // 可以在这里添加页面提示
        }
      );
    }

    function setup() {
      pixelDensity(1);
      // 创建画布并挂载到 #p5-overlay
      let c = createCanvas(treeImg.width, treeImg.height);
      c.parent('p5-overlay');
      
      let baseLine = height * config.groundY;
      for (let i = 0; i < width; i++) groundMap[i] = baseLine;

      treeImg.loadPixels();
      for (let x = 0; x < treeImg.width; x += 6) {
        for (let y = 0; y < treeImg.height; y += 6) {
          let index = (x + y * treeImg.width) * 4;
          if (treeImg.pixels[index + 3] > 50) branchPoints.push({ x, y });
        }
      }
      
      textFont('Georgia');
      textSize(config.fontSize);
      textAlign(CENTER, CENTER);

      // [关键] 如果 p5.js 成功启动并创建了 canvas，则隐藏底部的静态图片，避免重影
      // 如果 p5.js 加载失败（例如因为跨域问题），这行代码不会执行，静态图片就会保留显示
      // 移动到 draw() 中执行，确保 canvas 已经开始绘制后再隐藏
      // let staticTree = document.querySelector('.tree');
      // if(staticTree) staticTree.style.opacity = '0';
    }

    let hasHiddenStaticTree = false;

    function draw() {
      // 清除背景以保持透明
      clear();

      // 修正鼠标交互坐标映射 (处理CSS缩放)
      // 由于 canvas 被 CSS 缩放，我们需要计算实际的鼠标在画布坐标系中的位置
      // p5.js 的 mouseX/Y 是基于显示尺寸的，我们需要映射回 canvas 原始尺寸
      
      // 注意：elt 是 p5 canvas 的 DOM 元素引用，但在 p5 实例模式外通常用 canvas.elt 或直接通过 id 获取
      // 这里我们在全局模式，p5 会把 canvas 绑定到 default canvas 上
      // 为了稳妥，我们可以直接计算比例，或者假设 p5 的 winMouseX 修正
      // 简单做法：
      let canvasElem = document.querySelector('#p5-overlay canvas');
      let effectiveMouseX = mouseX;
      let effectiveMouseY = mouseY;
      
      if (canvasElem) {
         effectiveMouseX = mouseX * (width / canvasElem.offsetWidth);
         effectiveMouseY = mouseY * (height / canvasElem.offsetHeight);
      }

      // 修复：统一使用 config.margin
      let m = width * config.margin; 
      // 确保这一行里的 margin 全部替换为 m 或 config.margin
      // 使用修正后的鼠标坐标判断
      let isMouseHovering = (effectiveMouseX > m && effectiveMouseX < width - m && effectiveMouseY > m && effectiveMouseY < height - m);
      
      // 更新移动端计时器
      if (mobileShakeTimer > 0) {
        mobileShakeTimer--;
      }
      
      // 合并触发条件：鼠标悬停 或 移动端计时器激活
      let isHovering = isMouseHovering || (mobileShakeTimer > 0);

      // [优化] 确保在第一帧绘制完成后，才开始平滑淡出静态图片，彻底消除闪烁
      if (!hasHiddenStaticTree && frameCount > 5) {
        let staticTree = document.querySelector('.tree');
        if(staticTree) staticTree.style.opacity = '0';
        hasHiddenStaticTree = true;
      }

      // --- 平滑晃动逻辑 ---


      let targetSway = (isHovering && !isFinished) ? sin(frameCount * 0.08) * config.swayAmplitude : 0;
      
      // 使用 lerp 让 currentSway 缓缓逼近 targetSway
      // 0.05 是平滑系数，越小停下来就越慢、越柔和
      currentSway = lerp(currentSway, targetSway, 0.05);

      push();
      // 使用平滑后的 currentSway 进行错切变换
      // 修正：确保坐标原点在底部中心，这样摇摆时根部不动
      translate(width / 2, height); 
      shearX(currentSway);                
      // 修正：绘图坐标应该是 (-width/2, -height) 
      // 假设图片尺寸与 canvas 尺寸一致
      image(treeImg, -width / 2, -height, width, height);
      pop();

      // --- 生成逻辑 ---
      if (isHovering && !isFinished) {
        for (let i = 0; i < config.spawnIntensity; i++) {
          if (poemIndex < poem.length) {
            let pt = random(branchPoints);
            if (poem[poemIndex] !== " ") {
              particles.push(new Letter(pt.x, pt.y, poem[poemIndex]));
            }
            poemIndex++;
          } else { isFinished = true; }
        }
      }

      // --- 更新与显示 ---
      for (let p of particles) {
        p.update();
        p.display();
      }

      // [调试信息] 直接在画布上显示状态，帮助定位问题
      /*
      push();
      resetMatrix(); // 重置所有变换，确保文字绘制在左上角
      fill(255, 0, 0);
      textSize(16);
      textAlign(LEFT, TOP);
      text(`FPS: ${floor(frameRate())}`, 10, 10);
      text(`Image: ${treeImg.width}x${treeImg.height}`, 10, 30);
      text(`BranchPoints: ${branchPoints.length}`, 10, 50);
      text(`Particles: ${particles.length}`, 10, 70);
      text(`Hover: ${isHovering}`, 10, 90);
      pop();
      */

      // --- 更新标签位置 (悬挂效果) ---
      // let canvasElem = document.querySelector('#p5-overlay canvas'); // 之前已经在上面声明过了，直接复用
      if (canvasElem) {
        let cssHeight = canvasElem.offsetHeight; // 获取当前显示的实际高度
        
        // 定义标签配置：选择器，距离底部的高度比例(0-1)，噪声偏移
        // Experience: top 29% -> 距离底部约 0.71
        // Portfolio: top 54% -> 距离底部约 0.46
        // Introduction: bottom 25% -> 距离底部 0.25
        let labels = [
          { sel: '.label.experience',   h: 0.71, noiseOff: 100 },
          { sel: '.label.portfolio',    h: 0.46, noiseOff: 200 },
          { sel: '.label.introduction', h: 0.25, noiseOff: 300 }
        ];

        for (let l of labels) {
          let elem = document.querySelector(l.sel);
          if (elem) {
            // 1. 计算跟随树干的水平位移
            // 树是以底部为原点 shearX 的。
            // 某个高度 h (从底部算起) 的 x 偏移 = -h * tan(angle)
            let swayX = -cssHeight * l.h * Math.tan(currentSway);
            
            // 2. 计算飘动角度 (模拟风和惯性)
            // [调整] 降低频率 (0.03 -> 0.005)，减小幅度 (* 0.3 -> * 0.1)
            let windNoise = noise(frameCount * 0.01 + l.noiseOff);
            let wind = (windNoise - 0.5) * 0.2; 
            
            // [调整] 基础跟随树的摆动也减弱一点，更轻柔
            let baseSway = currentSway * 0.9; 
            
            let rot = baseSway + wind;

            // [新增] 模拟"曲度/柔软感"
            // 使用 skewX (错切) 来模拟物体被风吹时的形变
            // 当旋转角度越大，错切也越大，产生一种"被风吹弯"的视觉错觉
            let softSkew = rot * 15; // 错切系数，可以调整软度

            // 应用样式
            elem.style.transformOrigin = "top center"; // 修改旋转中心为顶部中心，更像悬挂
            // 添加 skewX 模拟曲度
            elem.style.transform = `translateX(${swayX}px) rotate(${rot}rad) skewX(${softSkew}deg)`;
          }
        }
      }
    }

    class Letter {
      constructor(x, y, char) {
        this.pos = createVector(x, y);
        this.vel = createVector(random(-0.5, 0.5), random(0.1, 0.5));
        this.acc = createVector(0, 0.04); 
        this.char = char;
        this.isStatic = false;
        this.angle = random(TWO_PI);
        this.noiseSeed = random(1000);
        this.finalAngle = random(-0.4, 0.4);
      }

      update() {
        if (this.isStatic) return;

        let breeze = map(noise(this.noiseSeed, frameCount * 0.015), 0, 1, -config.driftRange, config.driftRange);
        this.vel.x += breeze * 0.15;
        this.vel.add(this.acc);
        this.vel.mult(config.drag); 
        if (this.vel.y > config.maxFallSpeed) this.vel.y = config.maxFallSpeed;

        this.pos.add(this.vel);
        this.angle += (this.vel.mag() * 0.08) * config.rotateSpeed;

        let xIdx = floor(constrain(this.pos.x, 0, width - 1));
        if (this.pos.y >= groundMap[xIdx]) {
          this.pos.y = groundMap[xIdx];
          this.isStatic = true;
          
          let r = config.letterSpacing / 2;
          for (let i = -r; i <= r; i++) {
            let checkX = floor(constrain(xIdx + i, 0, width - 1));
            let lift = map(abs(i), 0, r, config.fontSize * 0.65, 0);
            groundMap[checkX] -= lift;
          }
        }
      }

      display() {
        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.isStatic ? this.finalAngle : this.angle);
        fill(70, this.isStatic ? 200 : 160);
        noStroke();
        text(this.char, 0, 0);
        pop();
      }
    }
    
    function mousePressed() {
      handleInput();
    }
    
    function touchStarted() {
      handleInput();
      // 返回 false 可能阻止滚动，根据体验决定是否保留
      // 如果点击的是画布区域，最好允许滚动，除非是游戏
      // 这里不 return false，允许页面滚动
    }

    function handleInput() {
      // 简单的点击触发逻辑：只要点击画布区域，就触发3秒动画
      // 移动端兼容性：p5.js 会将 touchStart 映射为 mousePressed
      let canvasElem = document.querySelector('#p5-overlay canvas');
      if (canvasElem) {
         // 这里简单判断，只要点击发生在 canvas 元素上（或任意位置如果覆盖层是全屏的）
         // 考虑到 p5-overlay 是覆盖在 tree-wrap 上的，点击树即点击 canvas
         // 增加一个简单的范围检查，或者直接允许点击任意位置触发（为了体验好一点）
         // 这里使用 p5 的 mouseX, mouseY 进行简单边界检查 (0 ~ width, 0 ~ height)
         if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
             mobileShakeTimer = 180; // 3秒 (60fps)
             // 不返回 false，允许点击穿透到下方的链接 (labels)
             // 但是 labels 的 z-index 是 20，canvas 是 10，所以点击 label 会先触发 label 的默认行为
         }
      }
    }
  </script>
  <!-- P5.js 代码插入位置 END -->
  <!-- 字符拆分动画脚本 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        // 定义目标元素及其基础延迟
        const targets = [
            { sel: '.intro-top h1', baseDelay: 0.1 },
            { sel: '.intro-top h2', baseDelay: 0.4 }, // 稍微晚一点
            { sel: '.intro-cta p', baseDelay: 2 }   // 晚很多
        ];

        targets.forEach(target => {
            const el = document.querySelector(target.sel);
            if(el) {
                // 获取文本内容，包括空格
                const text = el.textContent; 
                let html = '';
                
                // 遍历每个字符
                for(let i=0; i<text.length; i++) {
                    const char = text[i];
                    // 随机延迟：基础延迟 + 随机扰动 (0 ~ 0.8s)
                    // 使用 Math.random() 产生不规则感
                    const randomDelay = Math.random() * 0.8;
                    // 也可以加入一点点索引相关的延迟，让整体稍微有点顺序感，但不明显
                    const indexDelay = i * 0.02;
                    const totalDelay = target.baseDelay + randomDelay + indexDelay;
                    
                    html += `<span class="char" style="animation-delay: ${totalDelay}s">${char}</span>`;
                }
                
                // 替换原始内容
                el.innerHTML = html;
            }
        });
    });
  </script>
